[project]
name = "medalert"
version = "1.1.0"
description = "Aplicação CLI para controle de medicamentos para idosos"
authors = [
    { name = "Rafael William Dantas Quintiliano" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
    "tests",
]
